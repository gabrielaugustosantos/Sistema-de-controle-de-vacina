<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vacina - VacinaHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .sidebar { background-color: #2161a0; min-height: 100vh; color: white; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar-logo { font-weight: 800; font-size: 1.3rem; letter-spacing: 0.5px; }
        .sidebar a {
            color: rgba(255, 255, 255, 0.7); text-decoration: none; padding: 12px 20px;
            display: block; border-radius: 4px; margin-bottom: 5px; font-weight: 500; transition: all 0.2s ease-in-out;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: rgba(255, 255, 255, 0.15); color: white; border-left: 4px solid #ffb100;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <div class="col-md-2 col-lg-2 sidebar p-0 pt-4">
                <div class="text-center mb-5 sidebar-logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/3063/3063205.png" width="30" class="me-2 mb-1" style="filter: brightness(0) invert(1);"> 
                    VacinaHub
                </div>
                
                <div class="px-3">
                    <a href="/dashboard"><i class="bi bi-house-door me-2"></i> Visão Geral</a>
                    <a href="/caderneta"><i class="bi bi-journal-medical me-2"></i> Minha Caderneta</a>
                    <a href="/registrar-vacina" class="active"><i class="bi bi-syringe me-2"></i> Registrar Vacina</a>
                    <a href="#"><i class="bi bi-people me-2"></i> Dependentes</a>
                </div>
                
                <div class="position-absolute bottom-0 w-100 p-3 text-center" style="max-width: inherit;">
                    <a href="/" class="btn btn-outline-light btn-sm w-100 py-2" style="border: none; background: rgba(255,255,255,0.1);"><i class="bi bi-box-arrow-left me-1"></i> Sair da Conta</a>
                </div>
            </div>

            <div class="col-md-10 col-lg-10 p-5">
                
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h3 class="fw-bold text-dark" style="letter-spacing: -0.5px;">Registrar Nova Vacina</h3>
                    <a href="/caderneta" class="btn btn-outline-secondary rounded-pill px-4"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                </div>

                <div class="card shadow-sm border-0 rounded-4" style="max-width: 600px;">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="text-secondary mb-0 fw-semibold">Preencha os dados da aplicação</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <form action="/registrar-vacina" method="post">
                            
                            <div class="mb-4">
                                <label for="vacinaId" class="form-label fw-semibold text-dark">Qual vacina foi aplicada?</label>
                                <select class="form-select form-select-lg" id="vacinaId" name="vacinaId" required>
                                    <option value="" disabled selected>Selecione uma vacina...</option>
                                    <option th:each="vacina : ${vacinas}" 
                                            th:value="${vacina.id}" 
                                            th:text="${vacina.nome} + ' (' + ${vacina.publicoAlvo} + ')'">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="dataAplicacao" class="form-label fw-semibold text-dark">Data da Aplicação</label>
                                <input type="date" class="form-control form-control-lg" id="dataAplicacao" name="dataAplicacao" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 mt-2 fw-bold">
                                <i class="bi bi-check2-circle me-1"></i> Salvar Registro
                            </button>
                        </form>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
